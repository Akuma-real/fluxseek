name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      arch:
        description: '手动构建时的架构（留空构建全部）'
        required: false
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  build_android:
    name: Build Android (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            flutter-target: android-arm64
          - arch: armeabi-v7a
            flutter-target: android-arm
          - arch: x86_64
            flutter-target: android-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "✓ Using custom keystore from secrets"
          else
            echo "⚠ No ANDROID_KEYSTORE_BASE64 secret, build will fall back to debug signing"
          fi
          if [ -n "$ANDROID_KEY_PROPERTIES" ]; then
            echo "$ANDROID_KEY_PROPERTIES" > android/key.properties
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          else
            echo "⚠ No GOOGLE_SERVICES_JSON secret. build.gradle.kts still requires google-services plugin."
          fi

      - name: Build APK (${{ matrix.arch }})
        run: |
          dart tool/flutterw.dart build apk --release \
            --target-platform ${{ matrix.flutter-target }} \
            --dart-define=cronetHttpNoPlay=true

      - name: Stage artifact
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          TARGET="dist/fluxseek-${VERSION}-${{ matrix.arch }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "$TARGET"
          echo "Staged: $TARGET"
          echo "APK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.arch }}
          path: dist/
          retention-days: 7

  release:
    name: Publish Release
    needs: build_android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: android-*
          merge-multiple: true

      - name: Resolve version metadata
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          IS_PRERELEASE=false
          if [[ "$TAG" == *-* ]]; then
            IS_PRERELEASE=true
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          for file in $(find . -maxdepth 1 -type f -name "*.apk"); do
            sha256sum "$file" | awk -v f="$(basename "$file")" '{print $1"  "f}' > "${file}.sha256"
          done
          echo "Artifacts:"
          ls -la

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ steps.meta.outputs.TAG }}"
          VERSION="${{ steps.meta.outputs.VERSION }}"

          NOTES_FILE="release_notes.md"
          {
            echo "## fluxseek ${VERSION}"
            echo

            # 从 git log 生成提交清单（从上一个 tag 到当前 tag）
            PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -n1)
            if [ -n "$PREV_TAG" ]; then
              echo "### 变更 (since ${PREV_TAG})"
              echo
              git log --no-merges --pretty=format:"- %s" "${PREV_TAG}..${TAG}" \
                | grep -v '^- chore: bump version to ' \
                | grep -v '^- Update changelog' \
                || true
            else
              echo "fluxseek 首个版本 release。"
            fi
            echo
            echo

            # APK 下载表
            echo "### 下载"
            echo
            echo "| 架构 | 适用设备 |"
            echo "|---|---|"
            echo "| [arm64-v8a](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/fluxseek-${VERSION}-arm64-v8a.apk) | 2018 年后绝大多数 Android 设备 |"
            echo "| [armeabi-v7a](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/fluxseek-${VERSION}-armeabi-v7a.apk) | 老旧 32 位设备 |"
            echo "| [x86_64](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/fluxseek-${VERSION}-x86_64.apk) | Android 模拟器 / x86 Chromebook |"
            echo
            echo "> SHA256 校验文件与 APK 同包名 `.sha256`。"
            echo

            # 致谢
            echo "---"
            echo
            echo "本项目代码基础来自 [fluxdo](https://github.com/Lingyan000/fluxdo) (GPL-3.0)。"
          } > "$NOTES_FILE"

          cat "$NOTES_FILE"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: fluxseek ${{ steps.meta.outputs.VERSION }}
          body_path: release_notes.md
          prerelease: ${{ steps.meta.outputs.IS_PRERELEASE }}
          draft: false
          files: |
            dist/*.apk
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram notification
        if: always() && steps.meta.outputs.TAG != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not configured, skipping notification."
            exit 0
          fi

          TAG="${{ steps.meta.outputs.TAG }}"
          VERSION="${{ steps.meta.outputs.VERSION }}"
          IS_PRE="${{ steps.meta.outputs.IS_PRERELEASE }}"
          REPO="${{ github.repository }}"

          LABEL="Release"
          if [ "$IS_PRE" = "true" ]; then
            LABEL="Pre-release"
          fi

          TEXT=$(cat <<EOF
          🚀 *fluxseek ${LABEL}* v${VERSION}

          [GitHub Release](https://github.com/${REPO}/releases/tag/${TAG})

          📦 下载:
          • [arm64-v8a](https://github.com/${REPO}/releases/download/${TAG}/fluxseek-${VERSION}-arm64-v8a.apk)
          • [armeabi-v7a](https://github.com/${REPO}/releases/download/${TAG}/fluxseek-${VERSION}-armeabi-v7a.apk)
          • [x86\\_64](https://github.com/${REPO}/releases/download/${TAG}/fluxseek-${VERSION}-x86_64.apk)
          EOF
          )

          curl -sf "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode=Markdown \
            -d disable_web_page_preview=true \
            --data-urlencode "text=${TEXT}" \
            > /dev/null

          echo "✓ Telegram notification sent"
